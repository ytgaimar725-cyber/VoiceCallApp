name: Build Windows Executable

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Compile Executable
      run: dotnet publish -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:PublishReadyToRun=true

    - name: Publish to GitHub Releases
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $exe = Get-ChildItem -Path "bin/Release" -Filter "*.exe" -Recurse | Select-Object -First 1
        if (-not $exe) {
            Write-Error "Could not find compiled .exe file."
            exit 1
        }
        Write-Host "Found executable: $($exe.FullName)"
        
        # Delete old release tag if it exists
        gh release delete latest --cleanup-tag -y 2>$null
        
        # Create release and upload EXE
        gh release create latest "$($exe.FullName)" --title "Latest App Build" --notes "Download your executable below."
