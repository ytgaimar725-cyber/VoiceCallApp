name: Build and Publish CallApp EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish Standalone EXE
      run: |
        dotnet publish CallApp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

    - name: Upload CallApp EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CallApp-Windows-x64
        path: ./publish/CallApp.exe
        retention-days: 1
